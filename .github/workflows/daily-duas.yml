name: Daily Duas Auto-Publish
on:
  schedule:
    # الأوقات بتوقيت UTC. المغرب عادة UTC+1 (وUTC+0 خلال رمضان).
    - cron: "7 6 * * *"    # ~ 7:07 صباحا بتوقيت المغرب  -> دعاء الصباح
    - cron: "12 12 * * *"  # ~ 1:12 الظهر بتوقيت المغرب  -> دعاء الظهر
    - cron: "18 17 * * *"  # ~ 6:18 مساء بتوقيت المغرب   -> دعاء المساء
  workflow_dispatch:        # يسمح بتشغيل يدوي من تبويب Actions للتجربة
    inputs:
      slot:
        description: "الفترة (morning / afternoon / evening)"
        required: false
        default: "general"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Determine time slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 6 ]; then
              echo "slot=morning" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -eq 12 ]; then
              echo "slot=afternoon" >> "$GITHUB_OUTPUT"
            else
              echo "slot=evening" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and publish dua
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          DUA_SLOT: ${{ steps.slot.outputs.slot }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python publish.py
